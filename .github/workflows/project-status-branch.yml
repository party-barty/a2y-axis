name: Project status — branch → In Progress

on:
  create:

permissions:
  contents: read

jobs:
  set-in-progress:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      STATUS_FIELD_NAME: Status
      TARGET_STATUS: In Progress
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Skip if PROJECT_TOKEN not configured
        id: precheck
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$PROJECT_OWNER" ] || [ -z "$PROJECT_NUMBER" ]; then
            echo "PROJECT_TOKEN secret or project vars not set — skipping silently"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse issue number from branch name
        if: steps.precheck.outputs.skip != 'true'
        id: parse
        run: |
          BRANCH="${{ github.event.ref }}"
          ISSUE=$(echo "$BRANCH" | grep -oE -- '-[0-9]+$' | tr -d '-' || true)
          if [ -z "$ISSUE" ]; then
            echo "Branch '$BRANCH' has no trailing -<number> — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Detected issue #$ISSUE from branch '$BRANCH'"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Move issue to In Progress on Axis Studio board
        if: steps.parse.outputs.skip != 'true' && steps.parse.outputs.issue != ''
        env:
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # 1. Get project ID and Status field metadata
          PROJECT_DATA=$(gh api graphql -f query='
            query($owner: String!, $number: Int!) {
              user(login: $owner) {
                projectV2(number: $number) {
                  id
                  field(name: "'"$STATUS_FIELD_NAME"'") {
                    ... on ProjectV2SingleSelectField {
                      id
                      options { id name }
                    }
                  }
                }
              }
            }' -f owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER")
          PROJECT_ID=$(echo "$PROJECT_DATA" | jq -r '.data.user.projectV2.id')
          FIELD_ID=$(echo "$PROJECT_DATA" | jq -r '.data.user.projectV2.field.id')
          OPTION_ID=$(echo "$PROJECT_DATA" | jq -r --arg name "$TARGET_STATUS" '.data.user.projectV2.field.options[] | select(.name==$name) | .id')

          # 2. Get issue node ID
          ISSUE_NODE=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $num: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $num) { id }
              }
            }' -f owner="$REPO_OWNER" -f repo="$REPO_NAME" -F num="$ISSUE_NUMBER" | jq -r '.data.repository.issue.id')

          # 3. Find or create project item for this issue
          ITEM_ID=$(gh api graphql -f query='
            mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                item { id }
              }
            }' -f project="$PROJECT_ID" -f content="$ISSUE_NODE" | jq -r '.data.addProjectV2ItemById.item.id')

          # 4. Update Status field
          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item, fieldId: $field,
                value: { singleSelectOptionId: $option }
              }) { projectV2Item { id } }
            }' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$FIELD_ID" -f option="$OPTION_ID"
          echo "Issue #$ISSUE_NUMBER moved to '$TARGET_STATUS'"
