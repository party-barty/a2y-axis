name: Project status — PR → In Review / Done

on:
  pull_request:
    types: [opened, ready_for_review, reopened, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  set-status:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      STATUS_FIELD_NAME: Status
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Skip if PROJECT_TOKEN not configured
        id: precheck
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$PROJECT_OWNER" ] || [ -z "$PROJECT_NUMBER" ]; then
            echo "PROJECT_TOKEN secret or project vars not set — skipping silently"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine target status
        if: steps.precheck.outputs.skip != 'true'
        id: target
        run: |
          if [ "${{ github.event.action }}" = "closed" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            echo "status=Done" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.action }}" = "closed" ]; then
            echo "Skipping — PR closed without merge, no status change"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "status=In Review" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract linked issues from PR body
        if: steps.target.outputs.skip != 'true'
        id: parse
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Match Closes #N, Fixes #N, Resolves #N (case-insensitive)
          ISSUES=$(echo "$PR_BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true)
          if [ -z "$ISSUES" ]; then
            echo "No 'Closes #N' or similar in PR body — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub Actions outputs don't handle newlines well — use a delimiter
          {
            echo "issues<<EOF"
            echo "$ISSUES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update each linked issue's Status
        if: steps.parse.outputs.skip != 'true'
        env:
          ISSUES: ${{ steps.parse.outputs.issues }}
          TARGET_STATUS: ${{ steps.target.outputs.status }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          PROJECT_DATA=$(gh api graphql -f query='
            query($owner: String!, $number: Int!) {
              user(login: $owner) {
                projectV2(number: $number) {
                  id
                  field(name: "'"$STATUS_FIELD_NAME"'") {
                    ... on ProjectV2SingleSelectField {
                      id
                      options { id name }
                    }
                  }
                }
              }
            }' -f owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER")
          PROJECT_ID=$(echo "$PROJECT_DATA" | jq -r '.data.user.projectV2.id')
          FIELD_ID=$(echo "$PROJECT_DATA" | jq -r '.data.user.projectV2.field.id')
          OPTION_ID=$(echo "$PROJECT_DATA" | jq -r --arg name "$TARGET_STATUS" '.data.user.projectV2.field.options[] | select(.name==$name) | .id')

          while IFS= read -r ISSUE_NUMBER; do
            [ -z "$ISSUE_NUMBER" ] && continue
            echo "→ Issue #$ISSUE_NUMBER → $TARGET_STATUS"
            ISSUE_NODE=$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $num: Int!) {
                repository(owner: $owner, name: $repo) { issue(number: $num) { id } }
              }' -f owner="$REPO_OWNER" -f repo="$REPO_NAME" -F num="$ISSUE_NUMBER" | jq -r '.data.repository.issue.id')
            ITEM_ID=$(gh api graphql -f query='
              mutation($project: ID!, $content: ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { id } }
              }' -f project="$PROJECT_ID" -f content="$ISSUE_NODE" | jq -r '.data.addProjectV2ItemById.item.id')
            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field,
                  value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$FIELD_ID" -f option="$OPTION_ID"
          done <<< "$ISSUES"
